<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Minimalist Aesthetic Card Stack Favicon -->
  <rect width="64" height="64" rx="14" fill="#1c1917" />
  
  <!-- Back angled card shadow/outline -->
  <rect x="18" y="14" width="32" height="24" rx="3" fill="none" stroke="#78716c" stroke-width="2" opacity="0.6" transform="rotate(-6 34 26)" />
  
  <!-- Front minimalist clean card -->
  <rect x="15" y="19" width="34" height="26" rx="4" fill="#faf9f6" />
  
  <!-- Clean card text lines -->
  <rect x="20" y="25" width="16" height="3" rx="1" fill="#1c1917" />
  <rect x="20" y="31" width="24" height="2" rx="1" fill="#a8a29e" />
  <rect x="20" y="36" width="18" height="2" rx="1" fill="#d6d3d1" />
</svg>
